[package]
name = "impact-tier"
version = "0.1.0"
edition = "2021"
description = "Holds the tier role in a Muster community's Sputnik DAO: approves attended shifts and removes no-shows"
license = "MIT"
repository = "https://github.com/shanjiv177/muster"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
ed25519-dalek = "2"
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
